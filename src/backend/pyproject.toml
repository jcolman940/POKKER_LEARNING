[project]
name = "poker-study-backend"
version = "0.1.0"
description = "Local-first poker study tool: API, parsers, stats, recommendation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pokercore",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Only for scripts\package.ps1 (uv sync --group package): freezes the server with PyInstaller.
package = [
    "pyinstaller>=6",
]

[tool.uv.sources]
pokercore = { path = "../core" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "solver: runs the real TexasSolver binary (needs POKER_SOLVER_PATH)",
    "launcher: end-to-end tests of the packaged POKKER.exe (tests/launcher, needs dist/POKKER)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "pokercore"]
