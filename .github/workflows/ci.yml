name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Core (C++, MSVC)
        run: scripts/test.ps1 core

      - name: Benchmark
        run: scripts/bench.ps1 5000000

      - name: Backend
        run: scripts/test.ps1 backend

      - name: Frontend
        run: scripts/test.ps1 frontend

      - name: Integration
        run: scripts/test.ps1 integration
