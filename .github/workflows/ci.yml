name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Core (C++, MSVC)
        run: scripts/test.ps1 core

      - name: Benchmark
        run: scripts/bench.ps1 5000000

      - name: Cache TexasSolver
        id: texassolver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/TexasSolver
          key: texassolver-v0.2.0-windows

      - name: Download TexasSolver (AGPL, external binary; not part of the repo)
        if: steps.texassolver.outputs.cache-hit != 'true'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ts.zip'
          Invoke-WebRequest https://github.com/bupticybee/TexasSolver/releases/download/v0.2.0/TexasSolver-v0.2.0-Windows.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '0A9122FA0CD9384E6C1CBE0492E8A3B8AC7809890C649E1A53F77A59D6D50A7C') { throw "Hash inesperado: $hash" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'TexasSolver')

      - name: Point the backend at TexasSolver
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'TexasSolver\TexasSolver-v0.2.0-Windows\console_solver.exe'
          if (-not (Test-Path $exe)) { throw "TexasSolver no encontrado en $exe" }
          "POKER_SOLVER_PATH=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Backend
        run: scripts/test.ps1 backend

      - name: Frontend
        run: scripts/test.ps1 frontend

      - name: Integration
        run: scripts/test.ps1 integration

      # package.ps1 needs cl.exe on PATH (it only knows the local VS Build Tools path otherwise).
      - name: MSVC environment for packaging
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Package (PyInstaller server + launcher + smoke test)
        run: scripts/package.ps1 -SkipTests

      - name: Launcher end-to-end (local update feed)
        run: scripts/test.ps1 launcher

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: POKKER-package
          path: |
            dist/POKKER-*.zip
            dist/POKKER-*.zip.sha256
          if-no-files-found: error
