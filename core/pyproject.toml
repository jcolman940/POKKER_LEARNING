[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pokercore"
version = "0.1.0"
description = "Native hand evaluator and equity engine (C++20 + pybind11)"
requires-python = ">=3.12"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/pokercore"]

[tool.uv]
# Rebuild the extension whenever native sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "include/**/*.hpp" },
    { file = "src/**/*" },
    { file = "bindings/**/*.cpp" },
    { file = "python/**/*" },
]
